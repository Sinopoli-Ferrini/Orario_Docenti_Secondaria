<script>
  let orarioProfessori = {}, orarioClassi = {}, listaClassiSet = new Set();
  let listaDocentiOrdinata = []; // Elenco di supporto per i tasti Avanti/Indietro

  function elaboraDatabaseInterno() {
    orarioProfessori = {}; orarioClassi = {}; listaClassiSet.clear();
    
    righeOrarioSinopoli.forEach(riga => {
      riga = riga.trim();
      if (!riga) return;
      if (riga.startsWith('#')) {
        if(riga.startsWith('#MEMO:')) {
          document.getElementById('versione-file').innerText = riga.replace('#MEMO:', 'Database: ');
        }
        return;
      }

      const segmenti = riga.split(':');
      if (segmenti.length < 2) return;
      
      const nomeProf = segmenti[0].trim();
      const oreGrezze = segmenti[1].split(',').map(o => o.trim());
      orarioProfessori[nomeProf] = oreGrezze.slice(0, 30);

      orarioProfessori[nomeProf].forEach((strOra, indice) => {
        if (!strOra || strOra === '-' || strOra === 'R/ /') return;
        
        const info = strOra.replace(/^-/, '').split('/');
        let anno = info[0] ? info[0].trim() : "";
        let sez = info[1] ? info[1].trim() : "";
        let aula = info[2] ? info[2].trim() : (info[3] && info[3].trim() !== "") ? info[3].trim() : "";

        let clUnivoca = "";
        if (anno === "P" && sez === "O") { clUnivoca = ""; } 
        else if (anno === "R") { clUnivoca = ""; } 
        else if (anno && sez) { clUnivoca = anno + " " + sez; }

        if (clUnivoca) {
          listaClassiSet.add(clUnivoca);
          if (!orarioClassi[clUnivoca]) orarioClassi[clUnivoca] = Array(30).fill("");
          orarioClassi[clUnivoca][indice] = nomeProf + (aula ? " / " + aula : "");
        }
      });
    });

    popolaSelettoriModulari();
  }

  function popolaSelettoriModulari() {
    const sp = document.getElementById('select-prof');
    const sc = document.getElementById('select-classe');
    
    sp.innerHTML = '<option value="">Scegli un docente...</option>';
    sc.innerHTML = '<option value="">Scegli una classe...</option>';

    listaDocentiOrdinata = Object.keys(orarioProfessori).sort();
    listaDocentiOrdinata.forEach(p => { 
      sp.options[sp.options.length] = new Option(p, p); 
    });
    
    Array.from(listaClassiSet).sort().forEach(c => { 
      sc.options[sc.options.length] = new Option(c, c); 
    });
  }

  function gestisciPulsantiNavigazione(profCorrente) {
    const btnPrev = document.getElementById('btn-prev-prof');
    const btnNext = document.getElementById('btn-next-prof');
    
    if (!profCorrente) {
      btnPrev.disabled = true;
      btnNext.disabled = true;
      return;
    }
    
    const indice = listaDocentiOrdinata.indexOf(profCorrente);
    btnPrev.disabled = (indice <= 0);
    btnNext.disabled = (indice >= listaDocentiOrdinata.length - 1);
  }

  function navigaDocente(direzione) {
    const sp = document.getElementById('select-prof');
    const profCorrente = sp.value;
    if (!profCorrente) return;
    
    const indiceAttuale = listaDocentiOrdinata.indexOf(profCorrente);
    const nuovoIndice = indiceAttuale + direzione;
    
    if (nuovoIndice >= 0 && nuovoIndice < listaDocentiOrdinata.length) {
      const nuovoProf = listaDocentiOrdinata[nuovoIndice];
      sp.value = nuovoProf;
      mostraOrarioDocente(nuovoProf);
    }
  }

  function formattaCellaDocente(strOra) {
    if (!strOra || strOra === "-" || strOra.startsWith("R/") || strOra.startsWith("-R/")) {
      return '<span class="cell-vuota">libero</span>';
    }
    
    let stringaPulita = strOra.replace(/^-/, '');
    const info = stringaPulita.split('/');
    let anno = info[0] ? info[0].trim() : "";
    let sez = info[1] ? info[1].trim() : "";
    let aula = info[2] ? info[2].trim() : (info[3] && info[3].trim() !== "") ? info[3].trim() : "";
    
    if (anno === "R") return '<span class="cell-vuota">libero</span>';
    if (anno === "P" && sez === "O") return "<strong>P O T1</strong>";
    return "<strong>" + anno + " " + sez + "</strong>" + (aula ? "<span class='aula-info'>" + aula + "</span>" : "");
  }

  function formattaCellaClasse(strDato) {
    if (!strDato) return '<span class="cell-vuota">libero</span>';
    if (strDato.includes(' / ')) {
      const b = strDato.split(' / ');
      return "<strong>" + b[0] + "</strong><span class='aula-info'>" + b[1] + "</span>";
    }
    return "<strong>" + strDato + "</strong>";
  }

  function renderTabella(mappaDati, titolo, tipo) {
    document.getElementById('area-orario').style.display = 'block';
    document.getElementById('risultato-titolo').innerText = titolo;
    const corpo = document.getElementById('corpo-orario');
    corpo.innerHTML = "";
    
    for (let ora = 0; ora < 6; ora++) {
      let tr = document.createElement('tr');
      let tdOra = document.createElement('td'); tdOra.className = 'ora-col'; tdOra.innerText = (ora + 1) + '° Ora';
      tr.appendChild(tdOra);
      
      for (let g = 0; g < 5; g++) {
        let td = document.createElement('td');
        let index = (g * 6) + ora;
        td.innerHTML = (tipo === 'docente') ? formattaCellaDocente(mappaDati[index]) : formattaCellaClasse(mappaDati[index]);
        tr.appendChild(td);
      }
      corpo.appendChild(tr);
    }
  }

  function mostraOrarioDocente(p) { 
    if(p) { 
      document.getElementById('select-classe').value = ""; 
      renderTabella(orarioProfessori[p], "Docente: "+p, 'docente'); 
    }
    gestisciPulsantiNavigazione(p);
  }
  
  function mostraOrarioClasse(c) { 
    if(c) { 
      document.getElementById('select-prof').value = ""; 
      renderTabella(orarioClassi[c], "Classe: "+c, 'classe'); 
    }
    gestisciPulsantiNavigazione("");
  }

  window.addEventListener('DOMContentLoaded', elaboraDatabaseInterno);
</script>
</body>
</html>
